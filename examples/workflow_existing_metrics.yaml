schema_version: "1.0"

input:
  structure: "./synthetic_wt.pdb"
  format: "pdb"

variants:
  mode: "explicit"
  include_wt: true
  file: "./mutations_existing.csv"

modeling:
  enabled: false

metrics:
  sasa:
    - name: "ligand_sasa"
      selection: "resn LIG"
      calculate_wt_delta: true
      dot_solvent: true
      solvent_radius_angstrom: 1.4
      dot_density: 3
  minimum_distance:
    - name: "ligand_to_site_10"
      selection_a: "resn LIG"
      selection_b: "chain A and resi 10 and not name N+CA+C+O+OXT"
      calculate_wt_delta: true
  clashes:
    - name: "ligand_to_protein"
      selection_a: "resn LIG"
      selection_b: "polymer.protein"
      clash_overlap_angstrom: 0.4
      severe_overlap_angstrom: 0.8
      vdw_radii:
        C: 1.70
        N: 1.55
        O: 1.52
        S: 1.80
        P: 1.80
      exclude_bonded_pairs: false

quality_control:
  required_selections:
    - name: "ligand"
      selection: "resn LIG"
      expected_count: 1
      severity: "fail"

output:
  directory: "./demo_metrics_output"
  structure_formats: ["pdb"]
  keep_intermediates: false
